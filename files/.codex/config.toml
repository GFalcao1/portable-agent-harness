# Codex CLI faz parte da matriz: planner (gpt-6-astra) e code-reviewer
# (gpt-6.1-sol) rodam via `codex exec`, spawnados por tools/agents/delegate.py
# com modelo e effort travados no argv. NAO pine modelo aqui: a unica fonte de
# verdade e tools/agents/agents.json. Este arquivo nao e instalado no projeto
# (install.py o ignora); serve so como lembrete de que o Codex precisa estar
# autenticado (`codex login`) e com o projeto marcado como trusted em
# ~/.codex/config.toml ([projects."<caminho>"] trust_level = "trusted").
